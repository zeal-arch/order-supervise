[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-supervisor"
version = "1.0.0"
description = "Deterministic Long-Running AI Order Supervisor on Temporal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "temporalio>=1.5.1",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "domain*", "temporal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
exclude = [".venv", ".git", "__pycache__", "build", "dist"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
